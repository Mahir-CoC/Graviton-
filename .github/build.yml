name: Build APK

on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            libltdl-dev \
            libsqlite3-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.36

      - name: Set up Android SDK licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build debug APK
        run: |
          buildozer android debug 2>&1

      - name: List build output
        run: |
          echo "=== Contenu du dossier bin/ ==="
          ls -la bin/ || echo "Dossier bin/ introuvable"
          echo "=== Recherche APK ==="
          find . -name "*.apk" 2>/dev/null || echo "Aucun APK trouvé"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Graviton-APK
          path: "**/*.apk"
          if-no-files-found: warn
