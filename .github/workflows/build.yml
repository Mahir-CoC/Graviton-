name: Build APK

on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            wget

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.36

      - name: Setup Android SDK
        run: |
          # Créer les dossiers
          mkdir -p $ANDROID_HOME/cmdline-tools

          # Télécharger cmdline-tools
          wget --no-verbose \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdtools.zip

          # Extraire
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          # Ajouter au PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # Accepter toutes les licences
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # Installer les outils
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          # Créer le lien pour buildozer (il cherche dans tools/bin)
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                 $ANDROID_HOME/tools/bin/sdkmanager

          # Copier les licences là où buildozer les cherche
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          cp -r $ANDROID_HOME/licenses/* \
                $HOME/.buildozer/android/platform/android-sdk/licenses/ || true

          # Créer lien buildozer -> notre SDK
          mkdir -p $HOME/.buildozer/android/platform
          ln -sfn $ANDROID_HOME \
                  $HOME/.buildozer/android/platform/android-sdk

          echo "SDK prêt :"
          ls $ANDROID_HOME/

      - name: Download Android NDK r25b
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          cd $HOME/.buildozer/android/platform

          wget --no-verbose \
            "https://dl.google.com/android/repository/android-ndk-r25b-linux.zip" \
            -O ndk.zip

          unzip -q ndk.zip
          rm ndk.zip

          echo "NDK prêt :"
          ls $HOME/.buildozer/android/platform/

      - name: Build APK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          buildozer android debug 2>&1
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk

      - name: Find APK
        run: |
          echo "=== APK trouvé ==="
          find . -name "*.apk" 2>/dev/null || echo "Aucun APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Graviton-APK
          path: "**/*.apk"
          if-no-files-found: warn
