name: Build Gravity Switch APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Permet de lancer manuellement

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04   # Plus stable que ubuntu-latest pour Buildozer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Buildozer & dependencies
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            \~/.buildozer
          key: buildozer-\( {{ hashFiles('buildozer.spec') }}- \){{ github.run_id }}
          restore-keys: |
            buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer -v android debug
          workdir: .
          buildozer_version: master

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravitySwitch-APK
          path: bin/*.apk
          retention-days: 30
