name: Build APK

on:
  push:
    branches:
      - main  # Chaque fois que tu pushes sur la branche main, le build se déclenche

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Récupérer le code depuis GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2️⃣ Installer Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    # 3️⃣ Installer les dépendances système nécessaires pour Buildozer
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3-pip \
          build-essential \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5

    # 4️⃣ Installer Buildozer et Cython
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    # 5️⃣ Lancer Buildozer pour générer l'APK
    - name: Build APK
      run: |
        buildozer android debug

    # 6️⃣ Vérifier où se trouvent les fichiers APK
    - name: Show APK files
      run: find . -name "*.apk"

    # 7️⃣ Upload de tous les APK générés comme artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: graviton-apk
        path: ./**/*.apk  # prend tous les APK générés dans n’importe quel sous-dossier
